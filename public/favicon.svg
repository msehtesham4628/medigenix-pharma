<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Pill/Capsule Icon in pharmacy green -->
  <!-- Left hemisphere (white) -->
  <circle cx="12" cy="24" r="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <!-- Right hemisphere (green) -->
  <circle cx="36" cy="24" r="10" fill="#10b981" stroke="#10b981" stroke-width="2"/>
  <!-- Connect the two halves -->
  <rect x="12" y="14" width="24" height="20" fill="#ffffff"/>
  <rect x="26" y="14" width="10" height="20" fill="#10b981"/>
</svg>